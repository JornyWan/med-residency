#   medres train configs/recipes/adaopd/new_teacher.yaml --method adaopd --seed 42
# For another seed, start from that seed's student: student.init=runs/med_vqa_opd_s2/checkpoint-300 --seed 2
task: cxr_report_vqa
student: {init: runs/med_vqa_opd_s42/checkpoint-300}
